name: Release

# Builds the signed release APK and app bundle and, for a tag, publishes them as a
# GitHub Release. Runs when a version or POE tag is pushed, or by hand from the
# Actions tab for a dry run (a manual run builds and uploads the files as a
# workflow artifact but does not create a release).
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD  the keystore password
#   ANDROID_KEY_ALIAS          the key alias
#   ANDROID_KEY_PASSWORD       the key password
on:
  push:
    tags:
      - "v*"
      - "*POE*"
      - "*poe*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FromTheFarm/FromTheFarm.Api.Tests/FromTheFarm.Api.Tests.csproj

      - name: Build
        run: dotnet build FromTheFarm/FromTheFarm.Api.Tests/FromTheFarm.Api.Tests.csproj --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test FromTheFarm/FromTheFarm.Api.Tests/FromTheFarm.Api.Tests.csproj --no-build --configuration Release

      - name: Build Docker image
        run: docker build -t fromthefarm-api:release FromTheFarm/FromTheFarm.Api

  android:
    name: Signed Android release
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FromTheFarm/android
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail early and clearly rather than build an unsigned APK nobody can install.
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Work out the version
        run: |
          if [ -n "$TAG" ]; then
            name="${TAG#v}"
          else
            name="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          # Play requires a versionCode that only ever goes up; the run number does.
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Restore the keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and bundle
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease bundleRelease
          -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" --stacktrace

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Prints the certificate fingerprints. The SHA-1 is what Firebase needs
      # registered (Project settings > Your apps > Add fingerprint) before Google
      # sign-in works in this build.
      - name: Verify the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name the files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FromTheFarm-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/FromTheFarm-${VERSION_NAME}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FromTheFarm-${{ env.VERSION_NAME }}
          path: FromTheFarm/android/dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" dist/*
          --title "From The Farm $VERSION_NAME"
          --generate-notes
          --verify-tag
